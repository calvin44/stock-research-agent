[project]
name = "stock-research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "fastembed>=0.8.0",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.2",
    "langsmith>=0.8.8",
    "openai>=2.40.0",
    "psycopg>=3.3.4",
    "pypdf>=6.15.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.7.0",
    "tavily>=1.1.0",
    "uvicorn>=0.48.0",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests requiring real API calls",
]
[tool.ruff.lint.per-file-ignores]
"backend/agent/prompts.py" = ["E501"]
"backend/main.py" = ["E402"]
